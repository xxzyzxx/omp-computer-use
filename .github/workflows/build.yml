name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for GitVersion

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore FlaUI.Mcp.sln

    - name: Build
      run: dotnet build FlaUI.Mcp.sln --configuration Release --no-restore

    - name: Unit tests
      run: dotnet test tests/FlaUI.Mcp.Tests/FlaUI.Mcp.Tests.csproj --configuration Release --no-build
